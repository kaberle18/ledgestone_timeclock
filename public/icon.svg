<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d72ff"/>
      <stop offset="1" stop-color="#1b3a9c"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".14"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="go" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ff0a6"/>
      <stop offset="1" stop-color="#1fbf68"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- soft top shine -->
  <rect width="512" height="512" rx="112" fill="url(#shine)"/>
  <!-- clock track + progress arc (12 o'clock to ~4) -->
  <circle cx="256" cy="262" r="148" fill="none" stroke="#ffffff" stroke-opacity=".28" stroke-width="30"/>
  <path d="M256.0 114.0A148 148 0 0 1 377.2 346.9" fill="none" stroke="url(#go)" stroke-width="30" stroke-linecap="round"/>
  <!-- hands -->
  <path d="M256 262L256.0 164.0" stroke="#ffffff" stroke-width="26" stroke-linecap="round"/>
  <path d="M256 262L310.1 299.9" stroke="#ffffff" stroke-width="26" stroke-linecap="round"/>
  <circle cx="256" cy="262" r="20" fill="#ffffff"/>
</svg>
